experiment: E1-D6
task: Instinct-Locomotion-Flat-G1-ForwardResearch-v0
seed: 42
num_envs: 64
rollout_length_steps_per_env: 24
max_iterations: 200
init_noise_std: 0.2
device: cuda:0
headless: true
resume: false
checkpoint_loaded: false
starting_from: random_initialization
command:
  lin_vel_x: [0.5, 0.5]
  lin_vel_y: [0.0, 0.0]
  ang_vel_z: [0.0, 0.0]
  heading_command: false
  rel_heading_envs: 0.0
  rel_standing_envs: 0.0
  resampling_time_range: [100.0, 100.0]
prohibited_changes:
  - reward
  - termination
  - actuator
  - action_scale
  - joint_order
  - ppo_hyperparameters
  - action_clipping
  - tanh
  - terrain
  - moe
  - depth_camera
  - lidar
  - observation_history
